[project]
name = "vorm"
version = "0.1.12"
description = "Async ORM for MySQL and PostgreSQL, powered by Pydantic v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "asyncmy>=0.2",
    "asyncpg>=0.29",
    "cryptography>=49.0.0",
    "orjson>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = 'tests.*'
disable_error_code = ['no-untyped-def']

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]


[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org"
publish-url = "https://upload.pypi.org/legacy/"
explicit = true
