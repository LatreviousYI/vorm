name: Publish to PyPI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.version-check.outputs.version-changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check if version is newer than PyPI
        id: version-check
        run: |
          uv run --no-project --python 3.11 --with packaging python - <<'PY'
          import tomllib, json, os, urllib.request
          from packaging.version import Version

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)["project"]

          local = Version(data["version"])
          name = data["name"]

          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/json") as r:
                  remote = Version(json.load(r)["info"]["version"])
          except Exception:
              remote = Version("0")

          changed = local > remote
          print(f"local={local}  pypi={remote}  will_publish={changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version-changed={'true' if changed else 'false'}\n")
          PY

  build:
    name: Build package
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
