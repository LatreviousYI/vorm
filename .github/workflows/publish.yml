name: Publish to PyPI

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.version-check.outputs.version-changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Check if version is newer than PyPI
        id: version-check
        run: |
          uv run --with packaging python - <<'PY'
          import tomllib, urllib.request, json, os, sys
          from packaging.version import Version

          with open("pyproject.toml", "rb") as f:
              local = Version(tomllib.load(f)["project"]["version"])

          pypi_name = tomllib.load(open("pyproject.toml", "rb"))["project"]["name"]
          try:
              with urllib.request.urlopen(f"https://pypi.org/pypi/{pypi_name}/json") as r:
                  remote = Version(json.load(r)["info"]["version"])
          except Exception:
              remote = Version("0")

          changed = local > remote
          print(f"local={local}  pypi={remote}  will_publish={changed}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version-changed={'true' if changed else 'false'}\n")
          PY

  build:
    name: Build package
    needs: check-version
    if: needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5          # v4 → v5 (Node.js 24)

      - name: Install uv
        uses: astral-sh/setup-uv@v7         # v5 → v7 (Node.js 24)

      - name: Set up Python
        uses: actions/setup-python@v6       # v5 → v6 (Node.js 24)
        with:
          python-version-file: pyproject.toml

      - name: Build package
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v6    # v4 → v6 (Node.js 24)
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v7  # v4 → v7 (Node.js 24)
        with:
          name: dist
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v7         # v5 → v7 (Node.js 24)

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
